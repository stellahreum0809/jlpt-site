<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일본어 레벨 진단 테스트</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./test.css">
</head>
<body>
<div class="wrap" id="app">불러오는 중…</div>
<div class="dock" id="dock" hidden><div class="wrap"><button class="btn" id="dockbtn"></button></div></div>

<script>
const UNKNOWN=-1;
const LADDER=['beginner','n5-challenge','n5-stable','n4-stable','n3-challenge','n3-stable','n2-stable','n2-top','n1-ready'];
const RANGE={'beginner':'입문 단계','n5-challenge':'N5 도전권','n5-stable':'N5~N4 구간',
  'n4-stable':'N4~N3 구간','n3-challenge':'N3 구간','n3-stable':'N3~N2 구간','advanced':'측정 범위를 넘음'};
const STAGE2={'n5-stable':['n5','n4'],'n4-stable':['n4','n3'],
  'n3-challenge':['n3','n2'],'n3-stable':['n3','n2'],'advanced':['n2-top','n1']};
const TYPE_KO={vocab:'어휘',grammar:'문법',reading:'독해'};
const SEEN_KEY='jlpt-seen-ids';

let DATA=null;
let S={stage:1,blocks:[],cur:null,used:new Set(),seen:new Set(),band1:null};
const app=document.getElementById('app'),dock=document.getElementById('dock'),dockbtn=document.getElementById('dockbtn');
const score=b=>b.answers.filter((a,i)=>a===b.questions[i].answer).length;
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function loadSeen(){try{S.seen=new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||'[]'))}catch(e){S.seen=new Set()}}
function saveSeen(){try{localStorage.setItem(SEEN_KEY,JSON.stringify([...S.seen,...S.used]))}catch(e){}}
function setDock(label,fn){
  if(!label){dock.hidden=true;dockbtn.onclick=null;return}
  dock.hidden=false;dockbtn.textContent=label;dockbtn.onclick=fn;
}

/* 난이도 조합을 고정한 채 문항을 뽑는다 */
function pickBlock(level){
  const spec=DATA.blockSpec[level],pool=DATA.pools[level],slots=[];
  ['vocab','grammar','reading'].forEach(t=>{for(let i=0;i<(spec[t]||0);i++)slots.push(t)});
  const mix=shuffle([...spec.difficultyMix]),out=[];
  slots.forEach((t,i)=>{
    const target=mix[i]??2;
    const cand=(pool[t]||[]).filter(q=>!S.used.has(q.id));
    if(!cand.length)return;
    const unseen=cand.filter(q=>!S.seen.has(q.id));
    const src=unseen.length?unseen:cand;
    const dist=src.map(q=>Math.abs(q.d-target)),min=Math.min(...dist);
    const best=src.filter((q,k)=>dist[k]===min);
    const q=best[rnd(best.length)];
    S.used.add(q.id);out.push(q);
  });
  return out;
}

/* 1차 분기 — 항상 12문항 */
function nextLevel1(){
  const b=S.blocks;
  if(b.length===0)return 'n5';
  const s0=score(b[0]);
  if(b.length===1){
    if(s0===4)return 'n3';
    if(s0>=2)return 'n4';
    return 'n5';
  }
  if(b.length===2){
    const l1=b[1].level,s1=score(b[1]);
    if(s0<=1)return s1>=3?'n4':'n5';
    if(l1==='n3')return s1>=3?'n2':'n4';
    if(l1==='n4')return s1>=2?'n3':'n5';
  }
  return null;
}
function band1(){
  const b=S.blocks,s=b.map(score),l2=b[2].level;
  if(s[0]<=1){
    if(l2==='n4')return s[2]>=3?'n5-stable':'n5-challenge';
    return (s[1]+s[2])>=4?'n5-challenge':'beginner';
  }
  const l1=b[1].level;
  if(l1==='n3'){
    if(l2==='n2'){
      if(s[2]===4)return 'advanced';
      return s[2]>=2?'n3-stable':'n3-challenge';
    }
    return s[2]>=3?'n4-stable':'n5-stable';
  }
  if(l2==='n3'){
    if(s[1]>=3){
      if(s[2]>=3)return 'n3-stable';
      return s[2]===2?'n3-challenge':'n4-stable';
    }
    return s[2]>=2?'n3-challenge':'n4-stable';
  }
  return s[2]>=3?'n5-stable':'n5-challenge';
}
function finalBand(){
  const up=score(S.blocks[4]);
  if(S.band1==='advanced')return up>=3?'n1-ready':(up===2?'n2-top':'n2-stable');
  let i=LADDER.indexOf(S.band1);
  if(up>=3)i++;else if(up<=1)i--;
  return LADDER[Math.max(0,Math.min(LADDER.length-1,i))];
}

/* 화면 */
const answered=()=>S.blocks.reduce((n,b)=>n+b.answers.length,0);
function progress(){
  const total=S.stage===1?12:20,done=answered();
  return `<div class="topbar"><div class="bar"><span style="width:${(done/total*100).toFixed(1)}%"></span></div>
          <p class="count">${done+1} / ${total}</p></div>`;
}
function renderQuestion(){
  const{questions,idx}=S.cur,q=questions[idx];
  const hint=answered()<3
    ?`<p class="hint">감이 안 오면 찍지 말고 <b>모르겠어요</b>를 누르세요.<br>찍어서 맞힌 문제는 결과를 실제보다 높게 만듭니다.</p>`:'';
  setDock(null);
  app.innerHTML=progress()+`<div class="rise">`+
    (q.passage?`<div class="passage" lang="ja">${q.passage}</div>`:'')+
    `<p class="stem" lang="ja">${q.prompt}</p><div class="choices">`+
    q.options.map((o,i)=>`<button data-i="${i}"><span class="num">${i+1}</span><span lang="ja">${o}</span></button>`).join('')+
    `</div><button class="unknown" data-i="${UNKNOWN}">모르겠어요</button>${hint}</div>`;
  app.querySelectorAll('button[data-i]').forEach(btn=>{btn.onclick=()=>answer(+btn.dataset.i)});
  window.scrollTo(0,0);
}
function answer(i){
  S.blocks[S.blocks.length-1].answers.push(i);
  S.cur.idx++;
  if(S.cur.idx<S.cur.questions.length)return renderQuestion();
  const lvl=S.stage===1?nextLevel1():nextLevel2();
  if(lvl)return startBlock(lvl);
  S.stage===1?showStage1():showFinal();
}
function nextLevel2(){
  const set=STAGE2[S.band1];
  return S.blocks.length===3?set[0]:(S.blocks.length===4?set[1]:null);
}
function startBlock(level){
  const qs=pickBlock(level);
  S.blocks.push({level,questions:qs,answers:[]});
  S.cur={questions:qs,idx:0};
  renderQuestion();
}
function typeOf(q){return q.passage?'reading':(q.id.includes('v')?'vocab':'grammar')}
function areaStats(){
  const st={vocab:[0,0],grammar:[0,0],reading:[0,0]};
  S.blocks.forEach(b=>b.questions.forEach((q,i)=>{
    const t=typeOf(q);st[t][1]++;if(b.answers[i]===q.answer)st[t][0]++;
  }));
  return st;
}
function areasHtml(){
  const st=areaStats();
  return '<div class="areas">'+Object.keys(st).map(t=>{
    const[hit,tot]=st[t];if(!tot)return '';
    return `<div class="area"><span class="name">${TYPE_KO[t]}</span>
      <span class="track"><span style="width:${(hit/tot*100).toFixed(0)}%"></span></span>
      <span class="val">${hit}/${tot}</span></div>`;
  }).join('')+'</div>';
}
function unknownCount(){return S.blocks.reduce((n,b)=>n+b.answers.filter(a=>a===UNKNOWN).length,0)}
function wrongPoints(){
  const p=[];
  S.blocks.forEach(b=>b.questions.forEach((q,i)=>{
    if(b.answers[i]!==q.answer&&q.anchor&&!p.includes(q.anchor))p.push(q.anchor);
  }));
  return p;
}
function unknownNote(){
  const u=unknownCount();
  return u?`<p class="note">모르겠어요로 넘긴 ${u}문항은 틀린 것으로 계산했습니다.</p>`:'';
}

/* 문제별 해설 — 푼 순서대로 정답·오답·해설을 펼쳐 볼 수 있게 */
function reviewHtml(){
  let no=0;
  const items=[];
  S.blocks.forEach(b=>b.questions.forEach((q,i)=>{
    no++;
    const picked=b.answers[i],skipped=picked===UNKNOWN,ok=picked===q.answer;
    const cls=ok?'ok':(skipped?'skip':'no');
    const mark=ok?'✓':(skipped?'?':'✕');
    const opts=q.options.map((o,k)=>{
      let cl='',lb='';
      if(k===q.answer){cl='right';lb=(k===picked)?'정답 · 내 선택':'정답';}
      else if(k===picked){cl='mine';lb='내 선택';}
      return `<li class="${cl}"><span class="n">${k+1}</span><span class="tx" lang="ja">${o}</span>`+
             (lb?`<span class="lb">${lb}</span>`:'')+`</li>`;
    }).join('');
    items.push(`<details class="rv ${cls}">
      <summary><span class="mark" aria-hidden="true">${mark}</span>
        <span class="q" lang="ja">${q.prompt}</span><span class="chev" aria-hidden="true">›</span></summary>
      <div class="rv-body">`+
        (q.passage?`<div class="passage" lang="ja">${q.passage}</div>`:'')+
        `<p class="rv-stem" lang="ja">${q.prompt}</p>
        <ol class="rv-opts">${opts}</ol>`+
        (skipped?`<p class="rv-skip">모르겠어요로 넘긴 문제입니다.</p>`:'')+
        `<p class="rv-exp"><b>해설</b>${q.explanation||'해설을 준비 중입니다.'}</p>`+
        (q.anchor?`<span class="rv-tag" lang="ja">${q.anchor}</span>`:'')+
      `</div></details>`);
  }));
  if(!items.length)return '';
  const hit=S.blocks.reduce((n,b)=>n+score(b),0);
  return `<div class="review"><div class="review-head">
      <h3>문제별 해설 · ${no}문항 중 ${hit}개 정답</h3>
      <button type="button" id="rvall">모두 펼치기</button>
    </div>${items.join('')}</div>`;
}
function bindReview(){
  const btn=document.getElementById('rvall');
  if(!btn)return;
  btn.onclick=()=>{
    const ds=[...app.querySelectorAll('details.rv')],open=ds.some(d=>!d.open);
    ds.forEach(d=>{d.open=open});
    btn.textContent=open?'모두 접기':'모두 펼치기';
  };
}

function showStage1(){
  S.band1=band1();saveSeen();
  if(!STAGE2[S.band1])return showFinal(true);
  app.innerHTML=`<div class="rise">
    <span class="badge">12문항 완료</span>
    <p class="verdict">${RANGE[S.band1]}<small>여기까지가 12문항으로 알 수 있는 범위예요.<br>어느 쪽인지, 어느 영역이 약한지는 8문항이 더 필요합니다.</small></p>
    ${areasHtml()}${unknownNote()}
    <div class="callout"><b>8문항을 더 풀면 알 수 있어요</b>
      <ul><li>어휘·문법·독해 영역별 레벨</li>
      <li>두 급수 중 어느 쪽인지 확정</li>
      <li>다음 시험 응시 가능 여부</li></ul>
    </div>
    ${reviewHtml()}
    <div class="adslot">광고 자리</div>
    <div class="next"><a href="./n5-words.html">레벨별 학습 자료 보러 가기</a></div></div>`;
  setDock('8문항 더 풀기',()=>{S.stage=2;startBlock(nextLevel2())});
  bindReview();
  window.scrollTo(0,0);
}
function showFinal(early){
  const band=early?S.band1:finalBand();saveSeen();
  const label=(DATA.final_bands&&DATA.final_bands[band])||band;
  const pts=wrongPoints(),adv=(band==='n1-ready'||band==='n2-top');
  const earlyNote=early
    ?'<small>진단은 여기서 끝났습니다. 추가 8문항은 N4 이상을 가릴 때 쓰는 것이라 지금 단계에서는 의미가 없어요. 아래 로드맵부터 시작하시면 됩니다.</small>':'';
  app.innerHTML=`<div class="rise">
    <span class="badge">${answered()}문항 완료</span>
    <p class="verdict">${label}${earlyNote}</p>
    ${areasHtml()}${unknownNote()}
    ${adv?'<p class="lede">어휘와 문법은 상위 레벨에 도달해 있습니다. 독해는 지문이 길어질수록 부담이 커지니 그쪽 비중을 늘려보세요.</p>':''}
    ${pts.length?`<div class="points"><h3>틀렸거나 모르겠다고 한 포인트</h3><ul>${pts.map(p=>`<li lang="ja">${p}</li>`).join('')}</ul></div>`:''}
    ${reviewHtml()}
    <div class="adslot">광고 자리</div>
    <div class="next">
      <a href="./n5-words.html">레벨별 필수 단어</a>
      <a href="./n5-grammar.html">레벨별 문법 정리</a>
      <a href="./schedule.html">시험 일정·접수 방법</a>
    </div>
    <p style="margin-top:1rem"><button class="btn btn-quiet" id="again">다시 풀기 · 다른 문제가 나옵니다</button></p>
    <p style="text-align:center"><a class="back" href="./index.html">홈으로</a></p></div>`;
  setDock(null);
  bindReview();
  document.getElementById('again').onclick=()=>{
    S={stage:1,blocks:[],cur:null,used:new Set(),seen:S.seen,band1:null};
    loadSeen();startBlock('n5');
  };
  window.scrollTo(0,0);
}
function intro(){
  app.innerHTML=`<a class="back" href="./index.html">← 홈으로</a><div class="rise" style="padding-top:1.25rem">
    <p class="eyebrow">JLPT 레벨 진단</p>
    <h1>지금 내 일본어는<br>몇 급 수준일까</h1>
    <p class="lede">12문항으로 대략적인 구간을 확인하고, 원하면 8문항을 더 풀어 확정합니다. 문제는 매번 달라집니다.</p>
    <div class="callout"><b>모르는 문제는 찍지 마세요</b><br>
      보기 아래에 모르겠어요 버튼이 있습니다. 네 개 중에 찍으면 몰라도 넷에 하나는 맞기 때문에, 찍을수록 실제보다 높은 레벨이 나옵니다. 그러면 어느 영역이 약한지도 알 수 없어요.<br><br>
      모르겠어요를 누르면 틀린 것으로 처리되지만, 그 문제의 문법 포인트를 결과 화면에서 따로 알려드립니다.
    </div></div>`;
  setDock('테스트 시작',()=>startBlock('n5'));
}

fetch('./level-test-data.json')
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
  .then(d=>{DATA=d;loadSeen();intro()})
  .catch(()=>{
    setDock(null);
    app.innerHTML=`<div style="padding-top:3rem"><h2>문제 파일을 불러오지 못했습니다</h2>
    <p class="err">level-test-data.json 파일이 level-test.html과 같은 폴더에 있는지 확인하세요.</p>
    <p class="lede">파일을 더블클릭해서 여는 방식(file://)으로는 동작하지 않습니다. 로컬 서버로 열어야 합니다.</p></div>`;
  });
</script>
</body>
</html>
