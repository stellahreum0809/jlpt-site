<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일본어 레벨 진단 테스트</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --kr:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --jp:"Meiryo","メイリオ","Hiragino Sans","ヒラギノ角ゴシック ProN","BIZ UDPGothic","Noto Sans JP",sans-serif;
  --blue:#3182F6; --blue-dark:#1B64DA; --blue-pale:#E8F3FF;
  --bg:#FFFFFF; --surface:#F9FAFB; --surface-2:#F2F4F6; --surface-3:#E8EBED;
  --t1:#191F28; --t2:#4E5968; --t3:#8B95A1;
  --line:#E5E8EB; --red:#F04452;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);
  --r-xl:24px; --r-lg:20px; --r-md:14px;
  --ease:cubic-bezier(.25,.8,.35,1);
  --measure:32rem;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
/* 일본어 글자는 반드시 일본어 폰트로 — 한국식·중국식 한자 방지 */
:lang(ja){font-family:var(--jp);letter-spacing:0;font-feature-settings:"palt" 0}
body{background:var(--bg);color:var(--t1);font-family:var(--kr);
  font-size:16px;line-height:1.6;letter-spacing:-.015em;
  padding:calc(.75rem + env(safe-area-inset-top,0px)) 1.25rem
          calc(7rem + env(safe-area-inset-bottom,0px));
  -webkit-font-smoothing:antialiased}
.wrap{max-width:var(--measure);margin:0 auto}

/* 등장 모션 */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .34s var(--ease) both}
.rise:nth-child(2){animation-delay:.03s}
.rise:nth-child(3){animation-delay:.06s}

/* 진행 바 — 상단 고정 */
.topbar{position:sticky;top:0;background:var(--bg);padding:1.75rem 0 1.25rem;z-index:5}
.back{display:inline-block;font-size:.9375rem;font-weight:600;color:var(--t3);
  text-decoration:none;padding:1.5rem 0 .75rem}
.back:hover{color:var(--t1)}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--blue);border-radius:99px;
  transition:width .4s var(--ease)}
.count{font-size:.8125rem;font-weight:600;color:var(--t3);margin-top:.6rem}

.eyebrow{font-size:.9375rem;font-weight:600;color:var(--blue);margin-bottom:.6rem}
h1{font-size:2.125rem;line-height:1.3;font-weight:800;letter-spacing:-.04em;margin-bottom:1rem}
h2{font-size:1.5rem;font-weight:800;letter-spacing:-.035em;margin-bottom:.5rem}
p{margin-bottom:1rem}
p.lede{color:var(--t2);font-size:1.0625rem}

/* 문제 */
.passage{font-family:var(--jp);font-size:1rem;line-height:2.05;
  background:var(--surface);border-radius:var(--r-lg);
  padding:1.35rem 1.4rem;margin-bottom:1.5rem;white-space:pre-wrap}
.stem{font-family:var(--jp);font-size:1.375rem;line-height:1.85;font-weight:700;
  margin-bottom:2rem;letter-spacing:0}
.choices{display:flex;flex-direction:column;gap:.75rem}
.choices button{
  width:100%;text-align:left;cursor:pointer;font-family:var(--jp);font-size:1.0625rem;
  background:var(--surface);color:var(--t1);border:2px solid transparent;
  border-radius:var(--r-md);padding:1.15rem 1.25rem;
  display:flex;gap:.9rem;align-items:baseline;
  transition:background .15s var(--ease),border-color .15s var(--ease),transform .1s var(--ease)}
.choices button:hover{background:var(--blue-pale);border-color:var(--blue)}
.choices button:active{transform:scale(.985)}
.choices button:focus-visible{outline:none;border-color:var(--blue)}
.choices .num{font-family:var(--kr);font-size:.8125rem;font-weight:700;color:var(--t3);flex:0 0 auto}

.unknown{width:100%;margin-top:1.5rem;cursor:pointer;font-family:var(--kr);
  font-size:.9375rem;font-weight:600;color:var(--t2);
  background:var(--surface-2);border:none;border-radius:var(--r-md);padding:1rem;
  transition:background .15s var(--ease),transform .1s var(--ease)}
.unknown:hover{background:var(--surface-3);color:var(--t1)}
.unknown:active{transform:scale(.985)}
.unknown:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.hint{margin-top:1rem;font-size:.875rem;line-height:1.6;color:var(--t3);text-align:center}
.hint b{color:var(--t2);font-weight:600}
.callout{margin:1.75rem 0;padding:1.4rem;background:var(--surface);
  border-radius:var(--r-lg);font-size:.9375rem;line-height:1.75;color:var(--t2)}
.callout b{color:var(--t1);font-weight:700}
.callout ul{list-style:none;margin-top:.6rem}
.callout li{padding:.3rem 0 .3rem 1.1rem;position:relative}
.callout li::before{content:"";position:absolute;left:.15rem;top:.95rem;
  width:5px;height:5px;border-radius:99px;background:var(--blue)}

/* 하단 고정 버튼 */
.dock{position:fixed;left:0;right:0;bottom:0;
  padding:1rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--bg) 72%,rgba(255,255,255,0));z-index:10}
.dock .wrap{max-width:var(--measure)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;
  cursor:pointer;font:inherit;font-weight:700;font-size:1.0625rem;letter-spacing:-.02em;
  background:var(--blue);color:#fff;border:none;border-radius:var(--r-md);
  padding:1.1rem 1.9rem;transition:background .15s var(--ease),transform .1s var(--ease)}
.btn:hover{background:var(--blue-dark)}
.btn:active{transform:scale(.99)}
.btn-quiet{background:none;color:var(--t3);font-weight:500;font-size:.9375rem;padding:.7rem}
.btn-quiet:hover{background:none;color:var(--t1)}

/* 결과 */
.rise>.badge:first-child{margin-top:1.5rem}
.badge{display:inline-block;font-size:.875rem;font-weight:700;color:var(--blue);
  background:var(--blue-pale);border-radius:99px;padding:.4rem .9rem;margin-bottom:1rem}
.verdict{font-size:2.75rem;line-height:1.15;font-weight:800;letter-spacing:-.045em;margin-bottom:.75rem}
.verdict small{display:block;font-size:1rem;font-weight:400;letter-spacing:-.015em;
  color:var(--t2);margin-top:1rem;line-height:1.7}
.areas{background:var(--surface);border-radius:var(--r-xl);padding:.5rem 1.4rem;margin:2rem 0}
.area{display:flex;align-items:center;gap:1.1rem;padding:1.05rem 0}
.area+.area{border-top:1px solid var(--line)}
.area .name{flex:0 0 2.5rem;font-size:.9375rem;font-weight:700}
.area .track{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.area .track span{display:block;height:100%;background:var(--blue);border-radius:99px;
  animation:grow .6s var(--ease) both}
@keyframes grow{from{width:0}}
.area .val{flex:0 0 2.75rem;text-align:right;font-size:.875rem;font-weight:700;color:var(--t2)}
.points{background:var(--surface);border-radius:var(--r-xl);padding:1.4rem;margin:1.5rem 0}
.points h3{font-size:.9375rem;font-weight:700;margin-bottom:.85rem}
.points ul{list-style:none;display:flex;flex-wrap:wrap;gap:.45rem}
.points li{font-family:var(--jp);font-size:.875rem;background:#fff;
  border-radius:10px;padding:.4rem .75rem;color:var(--t2);box-shadow:var(--shadow)}
.note{font-size:.875rem;color:var(--t3);margin-top:-1.5rem;margin-bottom:2rem}
.next{margin-top:2rem;background:var(--surface);border-radius:var(--r-xl);padding:.5rem 1.4rem}
.next a{display:flex;justify-content:space-between;align-items:center;
  padding:1.05rem 0;font-weight:600;color:var(--t1);text-decoration:none}
.next a+a{border-top:1px solid var(--line)}
.next a:hover{color:var(--blue)}
.next a::after{content:"›";color:var(--t3);font-size:1.25rem}
.adslot{margin:2rem 0;padding:2.25rem;text-align:center;background:var(--surface-2);
  border-radius:var(--r-xl);color:var(--t3);font-size:.875rem}
.err{color:var(--red)}
@media (max-width:520px){
  .topbar{padding-top:2rem}
  .back{padding-top:1.75rem}
  h1{font-size:1.875rem}
  .verdict{font-size:2.25rem}
  .stem{font-size:1.25rem;margin-bottom:1.75rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app">불러오는 중…</div>
<div class="dock" id="dock" hidden><div class="wrap"><button class="btn" id="dockbtn"></button></div></div>

<script>
const UNKNOWN=-1;
const LADDER=['beginner','n5-challenge','n5-stable','n4-stable','n3-challenge','n3-stable','n2-stable','n2-top','n1-ready'];
const RANGE={'beginner':'입문 단계','n5-challenge':'N5 도전권','n5-stable':'N5~N4 구간',
  'n4-stable':'N4~N3 구간','n3-challenge':'N3 구간','n3-stable':'N3~N2 구간','advanced':'측정 범위를 넘음'};
const STAGE2={'n5-stable':['n5','n4'],'n4-stable':['n4','n3'],
  'n3-challenge':['n3','n2'],'n3-stable':['n3','n2'],'advanced':['n2-top','n1']};
const TYPE_KO={vocab:'어휘',grammar:'문법',reading:'독해'};
const SEEN_KEY='jlpt-seen-ids';

let DATA=null;
let S={stage:1,blocks:[],cur:null,used:new Set(),seen:new Set(),band1:null};
const app=document.getElementById('app'),dock=document.getElementById('dock'),dockbtn=document.getElementById('dockbtn');
const score=b=>b.answers.filter((a,i)=>a===b.questions[i].answer).length;
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function loadSeen(){try{S.seen=new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||'[]'))}catch(e){S.seen=new Set()}}
function saveSeen(){try{localStorage.setItem(SEEN_KEY,JSON.stringify([...S.seen,...S.used]))}catch(e){}}
function setDock(label,fn){
  if(!label){dock.hidden=true;dockbtn.onclick=null;return}
  dock.hidden=false;dockbtn.textContent=label;dockbtn.onclick=fn;
}

/* 난이도 조합을 고정한 채 문항을 뽑는다 */
function pickBlock(level){
  const spec=DATA.blockSpec[level],pool=DATA.pools[level],slots=[];
  ['vocab','grammar','reading'].forEach(t=>{for(let i=0;i<(spec[t]||0);i++)slots.push(t)});
  const mix=shuffle([...spec.difficultyMix]),out=[];
  slots.forEach((t,i)=>{
    const target=mix[i]??2;
    const cand=(pool[t]||[]).filter(q=>!S.used.has(q.id));
    if(!cand.length)return;
    const unseen=cand.filter(q=>!S.seen.has(q.id));
    const src=unseen.length?unseen:cand;
    const dist=src.map(q=>Math.abs(q.d-target)),min=Math.min(...dist);
    const best=src.filter((q,k)=>dist[k]===min);
    const q=best[rnd(best.length)];
    S.used.add(q.id);out.push(q);
  });
  return out;
}

/* 1차 분기 — 항상 12문항 */
function nextLevel1(){
  const b=S.blocks;
  if(b.length===0)return 'n5';
  const s0=score(b[0]);
  if(b.length===1){
    if(s0===4)return 'n3';
    if(s0>=2)return 'n4';
    return 'n5';
  }
  if(b.length===2){
    const l1=b[1].level,s1=score(b[1]);
    if(s0<=1)return s1>=3?'n4':'n5';
    if(l1==='n3')return s1>=3?'n2':'n4';
    if(l1==='n4')return s1>=2?'n3':'n5';
  }
  return null;
}
function band1(){
  const b=S.blocks,s=b.map(score),l2=b[2].level;
  if(s[0]<=1){
    if(l2==='n4')return s[2]>=3?'n5-stable':'n5-challenge';
    return (s[1]+s[2])>=4?'n5-challenge':'beginner';
  }
  const l1=b[1].level;
  if(l1==='n3'){
    if(l2==='n2'){
      if(s[2]===4)return 'advanced';
      return s[2]>=2?'n3-stable':'n3-challenge';
    }
    return s[2]>=3?'n4-stable':'n5-stable';
  }
  if(l2==='n3'){
    if(s[1]>=3){
      if(s[2]>=3)return 'n3-stable';
      return s[2]===2?'n3-challenge':'n4-stable';
    }
    return s[2]>=2?'n3-challenge':'n4-stable';
  }
  return s[2]>=3?'n5-stable':'n5-challenge';
}
function finalBand(){
  const up=score(S.blocks[4]);
  if(S.band1==='advanced')return up>=3?'n1-ready':(up===2?'n2-top':'n2-stable');
  let i=LADDER.indexOf(S.band1);
  if(up>=3)i++;else if(up<=1)i--;
  return LADDER[Math.max(0,Math.min(LADDER.length-1,i))];
}

/* 화면 */
const answered=()=>S.blocks.reduce((n,b)=>n+b.answers.length,0);
function progress(){
  const total=S.stage===1?12:20,done=answered();
  return `<div class="topbar"><div class="bar"><span style="width:${(done/total*100).toFixed(1)}%"></span></div>
          <p class="count">${done+1} / ${total}</p></div>`;
}
function renderQuestion(){
  const{questions,idx}=S.cur,q=questions[idx];
  const hint=answered()<3
    ?`<p class="hint">감이 안 오면 찍지 말고 <b>모르겠어요</b>를 누르세요.<br>찍어서 맞힌 문제는 결과를 실제보다 높게 만듭니다.</p>`:'';
  setDock(null);
  app.innerHTML=progress()+`<div class="rise">`+
    (q.passage?`<div class="passage" lang="ja">${q.passage}</div>`:'')+
    `<p class="stem" lang="ja">${q.prompt}</p><div class="choices">`+
    q.options.map((o,i)=>`<button data-i="${i}"><span class="num">${i+1}</span><span lang="ja">${o}</span></button>`).join('')+
    `</div><button class="unknown" data-i="${UNKNOWN}">모르겠어요</button>${hint}</div>`;
  app.querySelectorAll('button[data-i]').forEach(btn=>{btn.onclick=()=>answer(+btn.dataset.i)});
  window.scrollTo(0,0);
}
function answer(i){
  S.blocks[S.blocks.length-1].answers.push(i);
  S.cur.idx++;
  if(S.cur.idx<S.cur.questions.length)return renderQuestion();
  const lvl=S.stage===1?nextLevel1():nextLevel2();
  if(lvl)return startBlock(lvl);
  S.stage===1?showStage1():showFinal();
}
function nextLevel2(){
  const set=STAGE2[S.band1];
  return S.blocks.length===3?set[0]:(S.blocks.length===4?set[1]:null);
}
function startBlock(level){
  const qs=pickBlock(level);
  S.blocks.push({level,questions:qs,answers:[]});
  S.cur={questions:qs,idx:0};
  renderQuestion();
}
function typeOf(q){return q.passage?'reading':(q.id.includes('v')?'vocab':'grammar')}
function areaStats(){
  const st={vocab:[0,0],grammar:[0,0],reading:[0,0]};
  S.blocks.forEach(b=>b.questions.forEach((q,i)=>{
    const t=typeOf(q);st[t][1]++;if(b.answers[i]===q.answer)st[t][0]++;
  }));
  return st;
}
function areasHtml(){
  const st=areaStats();
  return '<div class="areas">'+Object.keys(st).map(t=>{
    const[hit,tot]=st[t];if(!tot)return '';
    return `<div class="area"><span class="name">${TYPE_KO[t]}</span>
      <span class="track"><span style="width:${(hit/tot*100).toFixed(0)}%"></span></span>
      <span class="val">${hit}/${tot}</span></div>`;
  }).join('')+'</div>';
}
function unknownCount(){return S.blocks.reduce((n,b)=>n+b.answers.filter(a=>a===UNKNOWN).length,0)}
function wrongPoints(){
  const p=[];
  S.blocks.forEach(b=>b.questions.forEach((q,i)=>{
    if(b.answers[i]!==q.answer&&q.anchor&&!p.includes(q.anchor))p.push(q.anchor);
  }));
  return p;
}
function unknownNote(){
  const u=unknownCount();
  return u?`<p class="note">모르겠어요로 넘긴 ${u}문항은 틀린 것으로 계산했습니다.</p>`:'';
}

function showStage1(){
  S.band1=band1();saveSeen();
  if(!STAGE2[S.band1])return showFinal(true);
  app.innerHTML=`<div class="rise">
    <span class="badge">12문항 완료</span>
    <p class="verdict">${RANGE[S.band1]}<small>여기까지가 12문항으로 알 수 있는 범위예요.<br>어느 쪽인지, 어느 영역이 약한지는 8문항이 더 필요합니다.</small></p>
    ${areasHtml()}${unknownNote()}
    <div class="callout"><b>8문항을 더 풀면 알 수 있어요</b>
      <ul><li>어휘·문법·독해 영역별 레벨</li>
      <li>틀린 문제의 문법 포인트</li>
      <li>다음 시험 응시 가능 여부</li></ul>
    </div>
    <div class="adslot">광고 자리</div>
    <div class="next"><a href="./n5-words.html">레벨별 학습 자료 보러 가기</a></div></div>`;
  setDock('8문항 더 풀기',()=>{S.stage=2;startBlock(nextLevel2())});
  window.scrollTo(0,0);
}
function showFinal(early){
  const band=early?S.band1:finalBand();saveSeen();
  const label=(DATA.final_bands&&DATA.final_bands[band])||band;
  const pts=wrongPoints(),adv=(band==='n1-ready'||band==='n2-top');
  const earlyNote=early
    ?'<small>진단은 여기서 끝났습니다. 추가 8문항은 N4 이상을 가릴 때 쓰는 것이라 지금 단계에서는 의미가 없어요. 아래 로드맵부터 시작하시면 됩니다.</small>':'';
  app.innerHTML=`<div class="rise">
    <span class="badge">${answered()}문항 완료</span>
    <p class="verdict">${label}${earlyNote}</p>
    ${areasHtml()}${unknownNote()}
    ${adv?'<p class="lede">어휘와 문법은 상위 레벨에 도달해 있습니다. 독해는 지문이 길어질수록 부담이 커지니 그쪽 비중을 늘려보세요.</p>':''}
    ${pts.length?`<div class="points"><h3>틀렸거나 모르겠다고 한 포인트</h3><ul>${pts.map(p=>`<li lang="ja">${p}</li>`).join('')}</ul></div>`:''}
    <div class="adslot">광고 자리</div>
    <div class="next">
      <a href="./n5-words.html">레벨별 필수 단어</a>
      <a href="./n5-grammar.html">레벨별 문법 정리</a>
      <a href="./schedule.html">시험 일정·접수 방법</a>
    </div>
    <p style="margin-top:1rem"><button class="btn btn-quiet" id="again">다시 풀기 · 다른 문제가 나옵니다</button></p>
    <p style="text-align:center"><a class="back" href="./index.html">홈으로</a></p></div>`;
  setDock(null);
  document.getElementById('again').onclick=()=>{
    S={stage:1,blocks:[],cur:null,used:new Set(),seen:S.seen,band1:null};
    loadSeen();startBlock('n5');
  };
  window.scrollTo(0,0);
}
function intro(){
  app.innerHTML=`<a class="back" href="./index.html">← 홈으로</a><div class="rise" style="padding-top:1.25rem">
    <p class="eyebrow">JLPT 레벨 진단</p>
    <h1>지금 내 일본어는<br>몇 급 수준일까</h1>
    <p class="lede">12문항으로 대략적인 구간을 확인하고, 원하면 8문항을 더 풀어 확정합니다. 문제는 매번 달라집니다.</p>
    <div class="callout"><b>모르는 문제는 찍지 마세요</b><br>
      보기 아래에 모르겠어요 버튼이 있습니다. 네 개 중에 찍으면 몰라도 넷에 하나는 맞기 때문에, 찍을수록 실제보다 높은 레벨이 나옵니다. 그러면 어느 영역이 약한지도 알 수 없어요.<br><br>
