<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OPIc 일본어 예상 등급 진단</title>
<meta name="description" content="12문항 자가진단으로 OPIc 일본어 예상 등급을 확인합니다. NL부터 AL까지, 발화 구성·정확도·주제 범위·과업 수행을 나눠 봅니다.">
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./test.css">
<style>
/* 자가진단 — 보기가 길어서 문항 화면만 살짝 다르게 */
.q-area{font-size:.8125rem;font-weight:700;color:var(--blue);margin-bottom:.5rem}
.q-stem{font-size:1.3125rem;line-height:1.6;font-weight:800;letter-spacing:-.03em;margin-bottom:1.75rem}
.choices button.sa{font-family:var(--kr);font-size:.9375rem;line-height:1.55;letter-spacing:-.015em;
  align-items:flex-start;padding:1.05rem 1.15rem}
.choices button.sa .num{padding-top:.1rem}
.scale{display:flex;flex-wrap:wrap;gap:.3rem;margin:1.25rem 0 2rem}
.scale span{font-size:.75rem;font-weight:700;color:var(--t3);background:var(--surface-2);
  border-radius:7px;padding:.3rem .5rem}
.scale span.on{background:var(--blue);color:#fff}
.caveat{margin:1.75rem 0;padding:1.25rem 1.35rem;background:var(--surface-2);
  border-radius:var(--r-lg);font-size:.875rem;line-height:1.7;color:var(--t2)}
.caveat b{color:var(--t1)}
@media (max-width:520px){.q-stem{font-size:1.1875rem}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="dock" id="dock" hidden><div class="wrap"><button class="btn" id="dockbtn"></button></div></div>

<script>
/* OPIc 등급 척도 — 낮은 쪽부터 0~8 */
const LEVELS=[
  {code:'NL', full:'Novice Low',        line:'단어를 하나씩 나열하는 단계'},
  {code:'NM', full:'Novice Mid',        line:'외워둔 표현으로 말하는 단계'},
  {code:'NH', full:'Novice High',       line:'짧은 문장이 나오기 시작한 단계'},
  {code:'IL', full:'Intermediate Low',  line:'익숙한 주제를 문장으로 말하는 단계'},
  {code:'IM1',full:'Intermediate Mid 1',line:'문장을 이어 붙이기 시작한 단계'},
  {code:'IM2',full:'Intermediate Mid 2',line:'문장을 여러 개 이어 말하는 단계'},
  {code:'IM3',full:'Intermediate Mid 3',line:'익숙한 주제라면 길게 말하는 단계'},
  {code:'IH', full:'Intermediate High', line:'낯선 상황도 설명해내는 단계'},
  {code:'AL', full:'Advanced Low',      line:'문단으로 구성해 말하는 단계'}
];
const AREA={
  text:'발화 구성', accuracy:'정확도', content:'주제와 어휘', task:'과업 수행'
};
const AREA_ORDER=['text','accuracy','content','task'];

/* cap:true 인 문항은 상한으로 쓰인다.
   ACTFL은 "무엇을 얼마나 오래 유지할 수 있는가"로 등급을 매기므로,
   발화 단위가 문장에 머무르면 다른 항목이 높아도 상위 등급이 되지 않는다. */
const QUESTIONS=[
  {area:'text', cap:true,
   q:'좋아하는 것에 대해 말해보라고 하면, 어느 정도까지 나오나요?',
   o:[['단어를 하나씩 떠올려 나열하는 정도예요',0],
      ['외워둔 문장 몇 개는 말할 수 있어요',2],
      ['짧은 문장을 그때그때 만들어 말해요',4],
      ['문장을 여러 개 이어서 말해요',6],
      ['이유와 예를 붙여 한 단락으로 구성해 말해요',8]]},

  {area:'text',
   q:'질문 하나에 대답하는 길이는 보통 어느 정도인가요?',
   o:[['한두 마디로 끝나요',0],
      ['두세 문장 정도예요',3],
      ['다섯 문장 안팎은 말해요',5],
      ['1분 넘게 이어서 말해요',7],
      ['2분 가까이, 앞뒤를 갖춰 말해요',8]]},

  {area:'text',
   q:'문장과 문장을 이을 때 접속 표현을 쓰나요?',
   o:[['문장을 툭툭 끊어서 말해요',1],
      ['だから, でも 정도만 써요',3],
      ['여러 접속 표현을 섞어 써요',5],
      ['이유·대조·순서를 자연스럽게 이어요',7],
      ['문단 전체의 흐름을 만들며 말해요',8]]},

  {area:'accuracy',
   q:'지난 주말에 있었던 일을 이야기할 때, 과거 시제가 유지되나요?',
   o:[['과거형을 잘 몰라요',1],
      ['알지만 말하다 보면 현재형으로 새요',3],
      ['대체로 유지되는데 길어지면 흔들려요',5],
      ['거의 일관되게 유지해요',7],
      ['시제를 의식하지 않아도 정확해요',8]]},

  {area:'accuracy',
   q:'조사와 동사 활용은 어떤가요?',
   o:[['자주 틀리고 스스로도 알아채기 어려워요',1],
      ['자주 틀리지만 의사는 전달돼요',3],
      ['대체로 맞고 가끔 틀려요',5],
      ['짧은 문장에서는 거의 정확해요',6],
      ['복잡한 문장에서도 정확한 편이에요',8]]},

  {area:'content',
   q:'익숙하지 않은 주제(사회 문제, 처음 듣는 상황)가 나오면 어떤가요?',
   o:[['아예 말을 못 꺼내요',1],
      ['아는 단어만 몇 개 나열해요',3],
      ['짧게라도 어떻게든 말해요',5],
      ['익숙한 주제만큼은 아니어도 설명은 해요',7],
      ['익숙한 주제와 큰 차이 없이 말해요',8]]},

  {area:'content',
   q:'쓰는 어휘의 폭은 어느 정도인가요?',
   o:[['기초 단어 몇 개뿐이에요',1],
      ['일상 단어는 대체로 알아요',3],
      ['같은 단어를 반복하지만 뜻은 전달돼요',5],
      ['상황에 맞게 단어를 바꿔 써요',6],
      ['구체적이고 다양한 표현을 골라 써요',8]]},

  {area:'content',
   q:'사람이나 장소를 묘사할 때는 어떤가요?',
   o:[['명사를 말하는 정도예요',1],
      ['大きい, いい 같은 기본 형용사를 써요',3],
      ['형용사를 몇 개 섞어 써요',4],
      ['상황에 맞는 형용사를 골라 써요',7],
      ['비교하거나 비유해서 설명해요',8]]},

  {area:'content',
   q:'상대가 얼마나 배려해줘야 대화가 이어지나요?',
   o:[['천천히 말해줘도 따라가기 어려워요',1],
      ['아주 천천히, 쉬운 말로 해줘야 해요',3],
      ['조금만 배려해주면 대화가 이어져요',5],
      ['보통 속도로 말해도 괜찮아요',7],
      ['특별한 배려 없이 대화할 수 있어요',8]]},

  {area:'task',
   q:'가게에서 문제가 생긴 상황(주문한 것이 잘못 나옴)을 일본어로 해결해야 한다면?',
   o:[['무슨 상황인지 설명하기 어려워요',1],
      ['정해진 표현으로 요청 정도는 해요',3],
      ['상황을 설명하고 원하는 것을 말해요',5],
      ['예상 못한 문제가 생겨도 대안을 제시해요',7],
      ['복잡한 상황도 조리 있게 풀어내요',8]]},

  {area:'task',
   q:'일본어로 대화를 얼마나 이어갈 수 있나요?',
   o:[['한두 마디 주고받으면 끊겨요',1],
      ['몇 번은 주고받을 수 있어요',3],
      ['익숙한 주제면 5분 이상 이어가요',5],
      ['주제가 바뀌어도 계속 이어가요',7],
      ['주제와 상관없이 길게 대화해요',8]]},

  {area:'task',
   q:'준비 없이 바로 답해야 할 때는 어떤가요?',
   o:[['준비를 해도 말이 잘 안 나와요',0],
      ['준비한 것만 겨우 말해요',2],
      ['익숙한 주제라면 준비 없이도 말해요',5],
      ['대부분의 주제에 바로 답해요',6],
      ['어떤 주제가 나와도 바로 답해요',8]]}
];

const app=document.getElementById('app'),dock=document.getElementById('dock'),dockbtn=document.getElementById('dockbtn');
let S={idx:0,answers:[]};

function setDock(label,fn){
  if(!label){dock.hidden=true;dockbtn.onclick=null;return}
  dock.hidden=false;dockbtn.textContent=label;dockbtn.onclick=fn;
}

/* 등급 산출
   1) 각 문항의 값을 낮은 쪽부터 정렬해 30% 지점을 고른다.
      "가장 잘한 순간"이 아니라 "대체로 유지되는 수준"을 등급으로 본다.
   2) 발화 단위(1번 문항)를 상한으로 씌운다. */
function grade(){
  const v=S.answers;
  const sorted=[...v].sort((a,b)=>a-b);
  const sustained=sorted[Math.floor(v.length*0.3)];
  return Math.max(0,Math.min(sustained,v[0]));
}
function areaAvg(){
  const acc={};
  AREA_ORDER.forEach(a=>acc[a]=[]);
  QUESTIONS.forEach((q,i)=>acc[q.area].push(S.answers[i]));
  const out={};
  AREA_ORDER.forEach(a=>{
    const arr=acc[a];
    out[a]=arr.reduce((x,y)=>x+y,0)/arr.length;
  });
  return out;
}

function progress(){
  const done=S.idx,total=QUESTIONS.length;
  return `<div class="topbar"><div class="bar"><span style="width:${(done/total*100).toFixed(1)}%"></span></div>
          <p class="count">${done+1} / ${total}</p></div>`;
}
function renderQuestion(){
  const q=QUESTIONS[S.idx];
  setDock(null);
  app.innerHTML=progress()+`<div class="rise">
    <p class="q-area">${AREA[q.area]}</p>
    <p class="q-stem">${q.q}</p>
    <div class="choices">`+
    q.o.map((o,i)=>`<button class="sa" data-i="${i}"><span class="num">${i+1}</span><span>${o[0]}</span></button>`).join('')+
    `</div></div>`;
  app.querySelectorAll('button[data-i]').forEach(b=>{
    b.onclick=()=>answer(q.o[+b.dataset.i][1]);
  });
  window.scrollTo(0,0);
}
function answer(val){
  S.answers.push(val);
  S.idx++;
  if(S.idx<QUESTIONS.length)return renderQuestion();
  showResult();
}

function scaleHtml(cur){
  return '<div class="scale">'+LEVELS.map((l,i)=>
    `<span class="${i===cur?'on':''}">${l.code}</span>`).join('')+'</div>';
}
function areasHtml(){
  const avg=areaAvg();
  return '<div class="areas">'+AREA_ORDER.map(a=>{
    const val=avg[a],lv=LEVELS[Math.round(val)];
    return `<div class="area"><span class="name" style="flex:0 0 5.5rem">${AREA[a]}</span>
      <span class="track"><span style="width:${(val/8*100).toFixed(0)}%"></span></span>
      <span class="val">${lv.code}</span></div>`;
  }).join('')+'</div>';
}
function nextStep(i){
  const tips=[
    '먼저 문장을 만드는 것부터입니다. 「私は〜です」「〜が好きです」처럼 짧아도 좋으니 단어가 아니라 문장으로 끝맺는 연습을 하세요.',
    '외운 문장을 바꿔 쓰는 연습이 필요합니다. 같은 틀에 단어만 갈아 끼워 열 문장을 만들어보세요.',
    '문장 하나로 끝내지 말고 한 문장을 덧붙이세요. 이유(〜から)나 예(たとえば)를 붙이는 것만으로 길이가 두 배가 됩니다.',
    '문장을 이어 붙이는 단계로 넘어갈 때입니다. だから, でも, それから를 의식적으로 써서 세 문장을 한 덩어리로 묶어보세요.',
    '과거 시제를 붙잡으세요. IM 구간에서 가장 많이 새는 곳이 시제입니다. 지난 주말 이야기를 과거형만으로 1분 말해보세요.',
    '같은 단어를 반복하는 습관을 줄이세요. 하나의 대상을 세 가지 다른 표현으로 말하는 연습이 효과가 큽니다.',
    '익숙하지 않은 주제로 넘어가세요. IH의 갈림길은 돌발 주제입니다. 사회·시사 주제로 1분씩 말해보세요.',
    '문제 해결형 롤플레이를 연습하세요. 상황 설명 → 요청 → 대안 제시의 세 단계를 한 번에 이어 말하는 것이 관건입니다.',
    '지금 구간이라면 답변의 구조를 다듬을 차례입니다. 서론·본론·마무리가 드러나게 말하는 연습을 하세요.'
  ];
  return tips[i];
}
function showResult(){
  const i=grade(),lv=LEVELS[i];
  setDock(null);
  app.innerHTML=`<div class="rise">
    <span class="badge">12문항 완료</span>
    <p class="verdict">${lv.code}<small>${lv.full} · ${lv.line}</small></p>
    ${scaleHtml(i)}
    <h2 style="font-size:1.0625rem;margin-bottom:.75rem">영역별로 보면</h2>
    ${areasHtml()}
    <p class="note" style="margin-top:-1rem">영역별 표시는 그 영역의 평균이고, 위의 등급은 <b>모든 영역에서 일관되게 유지되는 수준</b>입니다. 그래서 영역 평균보다 한 단계 낮게 나오기도 합니다.</p>
    <div class="callout"><b>한 단계 올리려면</b><br>${nextStep(i)}</div>
    <div class="caveat">
      <b>이 결과는 자가진단입니다.</b> 실제 OPIc은 응시자의 답변을 ACTFL 공인 평가자가 듣고 전반적으로 평가합니다.
      이 페이지는 녹음을 채점하지 않고, 여러분이 고른 답을 ACTFL 등급 기준에 비추어 계산한 것입니다.
      스스로를 높게 보면 결과도 높게 나오니, 실제 등급과는 차이가 있을 수 있습니다.
      공부 방향을 정하는 참고용으로 쓰세요.
    </div>
    <div class="adslot">광고 자리</div>
    <div class="next">
      <a href="./index.html#exam">OPIc 시험 정보 보기</a>
      <a href="./level-test.html">JLPT 레벨 진단 테스트</a>
      <a href="./index.html#learn">말하기 시험 대비 자료</a>
    </div>
    <p style="margin-top:1rem"><button class="btn btn-quiet" id="again">다시 진단하기</button></p>
    <p style="text-align:center"><a class="back" href="./index.html">홈으로</a></p></div>`;
  document.getElementById('again').onclick=()=>{S={idx:0,answers:[]};intro()};
  window.scrollTo(0,0);
}

function intro(){
  app.innerHTML=`<a class="back" href="./index.html">← 홈으로</a><div class="rise" style="padding-top:1.25rem">
    <p class="eyebrow">OPIc 일본어</p>
    <h1>지금 시험을 보면<br>어느 등급이 나올까</h1>
    <p class="lede">OPIc은 말하기 시험이라 정답을 맞히는 방식으로는 잴 수 없습니다. 대신 실제 시험의 Self Assessment와 같은 방식으로, 무엇을 어디까지 할 수 있는지 12문항으로 확인합니다.</p>
    <div class="callout"><b>솔직하게 고르는 것이 핵심입니다</b><br>
      "할 수 있을 것 같다"가 아니라 <b>지금 당장 준비 없이 되는가</b>로 고르세요.
      실제 OPIc도 잘한 순간이 아니라 일관되게 유지되는 수준으로 등급을 매깁니다.
      스스로를 높게 잡으면 이 진단도 실제보다 높은 등급을 내놓습니다.
    </div></div>`;
  setDock('진단 시작',()=>{S={idx:0,answers:[]};renderQuestion()});
}
intro();
</script>
</body>
</html>
